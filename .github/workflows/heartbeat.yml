name: Heartbeat

# GitHub disables scheduled workflows in public repos after 60 days without commits.
on:
  schedule:
    - cron: '7 9 * * 1'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  heartbeat:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Commit only when the repo has been quiet for 30 days
        run: |
          last=$(git log -1 --format=%ct)
          now=$(date +%s)
          if [ $(( now - last )) -lt $(( 30 * 86400 )) ]; then
            echo "Recent commit exists, nothing to do."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit --allow-empty -m "chore: heartbeat (keeps scheduled workflows enabled)"
          git push
