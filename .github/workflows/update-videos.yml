name: Update videos

on:
  schedule:
    - cron: '23 * * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: Jen vypsat změny, nic necommitovat
        type: boolean
        default: false
      refresh_thumbs:
        description: Znovu stáhnout miniatury videí z feedů
        type: boolean
        default: false
      allow_mass_removal:
        description: Povolit smazání více než 2 videí najednou
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: update-videos
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Update video data
        run: node scripts/videos/cli.ts ${{ inputs.dry_run && '--dry-run' || '' }} ${{ inputs.refresh_thumbs && '--refresh-thumbs' || '' }} ${{ inputs.allow_mass_removal && '--allow-mass-removal' || '' }}
      - name: Commit changes
        if: ${{ !inputs.dry_run }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          if [ -z "$(git status --porcelain -- src/data src/assets/thumbs)" ]; then
            echo "No changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data src/assets/thumbs
          git commit -m "data: update videos"
          git pull --rebase
          git push "https://x-access-token:${GITHUB_TOKEN}@github.com/${REPO}.git" HEAD:main
